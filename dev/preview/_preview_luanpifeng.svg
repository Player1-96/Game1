<svg viewBox="0 0 700 352" width="100%" xmlns="http://www.w3.org/2000/svg"><rect width="700" height="352" fill="#0e0a1a"/><text x="32" y="28" font-family="sans-serif" font-size="14" fill="#c9c4e0">没有乱披风 · 挥砍弧度固定</text><rect x="30" y="44" width="302" height="238" rx="10" fill="#141126" stroke="#2e2748" stroke-width="1"/><path d="M181 150 L120.6 75.4 A96 96 0 0 1 241.4 75.4 Z" fill="#7f8b9e" fill-opacity="0.16" stroke="#7f8b9e" stroke-opacity="0.75" stroke-width="1"/><path d="M181 150 L120.6 75.4 A96 96 0 0 1 241.4 75.4 Z" fill="#7f8b9e" fill-opacity="0.16" stroke="#7f8b9e" stroke-opacity="0.75" stroke-width="1"/><path d="M181 150 L120.6 75.4 A96 96 0 0 1 241.4 75.4 Z" fill="#7f8b9e" fill-opacity="0.16" stroke="#7f8b9e" stroke-opacity="0.75" stroke-width="1"/><path d="M181 150 L120.6 75.4 A96 96 0 0 1 241.4 75.4 Z" fill="#7f8b9e" fill-opacity="0.16" stroke="#7f8b9e" stroke-opacity="0.75" stroke-width="1"/><path d="M181 150 L120.6 75.4 A96 96 0 0 1 241.4 75.4 Z" fill="#7f8b9e" fill-opacity="0.16" stroke="#7f8b9e" stroke-opacity="0.75" stroke-width="1"/><path d="M181 150 L120.6 75.4 A96 96 0 0 1 241.4 75.4 Z" fill="#7f8b9e" fill-opacity="0.16" stroke="#7f8b9e" stroke-opacity="0.75" stroke-width="1"/><circle cx="181" cy="150" r="6" fill="#e8e6f5"/><text x="42" y="272" font-family="sans-serif" font-size="12" fill="#8f8ba8">6 次挥砍的弧度：</text><text x="42" y="292" font-family="monospace" font-size="13" fill="#7f8b9e">78°  78°  78°  78°  78°  78°</text><text x="370" y="28" font-family="sans-serif" font-size="14" fill="#c9c4e0">有乱披风 · 每次弧度都不同</text><rect x="368" y="44" width="302" height="238" rx="10" fill="#141126" stroke="#2e2748" stroke-width="1"/><path d="M519 150 L439.0 97.0 A96 96 0 0 1 599.0 97.0 Z" fill="#5fd6b0" fill-opacity="0.16" stroke="#5fd6b0" stroke-opacity="0.75" stroke-width="1"/><path d="M519 150 L423.9 162.9 A96 96 0 0 1 614.1 162.9 Z" fill="#5fd6b0" fill-opacity="0.16" stroke="#5fd6b0" stroke-opacity="0.75" stroke-width="1"/><path d="M519 150 L427.7 120.4 A96 96 0 0 1 610.3 120.4 Z" fill="#5fd6b0" fill-opacity="0.16" stroke="#5fd6b0" stroke-opacity="0.75" stroke-width="1"/><path d="M519 150 L460.6 73.8 A96 96 0 0 1 577.4 73.8 Z" fill="#5fd6b0" fill-opacity="0.16" stroke="#5fd6b0" stroke-opacity="0.75" stroke-width="1"/><path d="M519 150 L423.6 161.1 A96 96 0 0 1 614.4 161.1 Z" fill="#5fd6b0" fill-opacity="0.16" stroke="#5fd6b0" stroke-opacity="0.75" stroke-width="1"/><path d="M519 150 L423.9 163.1 A96 96 0 0 1 614.1 163.1 Z" fill="#5fd6b0" fill-opacity="0.16" stroke="#5fd6b0" stroke-opacity="0.75" stroke-width="1"/><circle cx="519" cy="150" r="6" fill="#e8e6f5"/><text x="380" y="272" font-family="sans-serif" font-size="12" fill="#8f8ba8">6 次挥砍的弧度：</text><text x="380" y="292" font-family="monospace" font-size="13" fill="#5fd6b0">113°  195°  144°  75°  193°  196°</text><text x="16" y="318" font-family="sans-serif" font-size="12" fill="#8f8ba8">两侧同为舞剑流的一次普通挥砍；spread = 2（乱披风 +2）。</text><text x="16" y="336" font-family="sans-serif" font-size="12" fill="#8f8ba8">命中数仍受「基础 3 + pierce」封顶，扫得再宽也不会变成无脑清场。</text></svg>